name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run on the same ref when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # MLX is Mac-only; on Linux CI we install the non-MLX deps directly
        # and skip the model marker. This keeps CI fast and free.
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml lark pytest numpy
          # Install the package in editable mode without pulling mlx*.
          pip install --no-deps -e .

      - name: Run tests (mock-only, no MLX)
        run: |
          pytest -m "not model" -q

  port-discipline:
    name: gardener has no omlx imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for forbidden imports
        run: |
          # Existing CI gate from earlier work — Gardener must not depend
          # on omlx at runtime. tests/test_no_omlx_import.py also asserts
          # this; this is the cheap pre-test check.
          if grep -rn --include='*.py' -E '^(from|import)\s+omlx(\b|\.)' gardener/; then
            echo "❌ found forbidden omlx import in gardener/"
            exit 1
          fi
          echo "✓ no omlx imports in gardener/"
